summary: This module enables students to perform a series of Use Case exercises that build their Microsoft 365 Copilot skills in IT-related business scenarios.
abstract: |
  By the end of this module, you should be able to:

  -   Use Microsoft 365 Copilot Chat to summarize the information in a product spec document for a network security product and create a project plan to implement the product.

  -   Use Microsoft 365&nbsp;Copilot in Excel to analyze company assets, identify key trends and issues related to asset warranties, and generate insightful charts to visualize asset data and identify warranty patterns that require attention.&nbsp;

  -   Use Microsoft 365&nbsp;Copilot in Word to modify a technical implementation report for a customer who is planning to install your new network security product.

  -   Use Microsoft 365&nbsp;Copilot in Outlook to draft an email that provides highlights from the technical implementation report that you created for the customer who is installing your new network security product.
